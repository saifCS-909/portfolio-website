<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Chitrali Dry Fruits</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .login-section {
            padding: 60px 0;
            min-height: 70vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #fdf8f2 0%, #f5ede4 100%);
        }
        .login-container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            background: #fff;
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            border: 1px solid #f0ebe4;
        }
        .login-container .logo-icon {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-container .logo-icon i {
            font-size: 3rem;
            color: #8b2f1a;
            background: #f5f0ea;
            padding: 16px;
            border-radius: 50%;
        }
        .login-container h2 {
            text-align: center;
            font-size: 1.8rem;
            color: #2d2a24;
            margin-bottom: 6px;
        }
        .login-container .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }
        .login-container label {
            display: block;
            font-weight: 600;
            color: #2d2a24;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .login-container input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e0d6;
            border-radius: 10px;
            font-size: 1rem;
            transition: 0.3s;
            margin-bottom: 16px;
            background: #faf8f5;
        }
        .login-container input:focus {
            border-color: #8b2f1a;
            outline: none;
            background: #fff;
        }
        .login-container .btn-primary {
            width: 100%;
            text-align: center;
            padding: 14px;
            font-size: 1rem;
        }
        .login-container .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 20px;
            font-size: 0.9rem;
        }
        .login-container .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            color: #5a554a;
            cursor: pointer;
        }
        .login-container .form-options a {
            color: #8b2f1a;
            font-weight: 500;
        }
        .login-container .form-options a:hover {
            text-decoration: underline;
        }
        .login-container .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: #ccc;
            font-size: 0.85rem;
        }
        .login-container .divider::before,
        .login-container .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e0d6;
        }
        .login-container .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .login-container .social-login button {
            padding: 10px;
            border: 2px solid #e8e0d6;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .login-container .social-login button:hover {
            border-color: #8b2f1a;
            background: #faf8f5;
        }
        .login-container .social-login .google {
            color: #ea4335;
        }
        .login-container .social-login .facebook {
            color: #1877f2;
        }
        .login-container .register-link {
            text-align: center;
            margin-top: 20px;
            color: #5a554a;
            font-size: 0.95rem;
        }
        .login-container .register-link a {
            color: #8b2f1a;
            font-weight: 600;
        }
        .login-container .register-link a:hover {
            text-decoration: underline;
        }
        .login-tabs {
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 2px solid #e8e0d6;
        }
        .login-tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            color: #5a554a;
        }
        .login-tabs button.active {
            background: #8b2f1a;
            color: #fff;
        }
        .login-tabs button:hover:not(.active) {
            background: #f5f0ea;
        }
        .register-fields {
            display: none;
        }
        .register-fields.active {
            display: block;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle input {
            padding-right: 44px;
        }
        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
        }
        .password-toggle .toggle-btn:hover {
            color: #2d2a24;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 18px;
                margin: 0 12px;
            }
            .login-container .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
